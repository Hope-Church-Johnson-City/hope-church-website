  <!-- Theme detection — runs BEFORE React so there's no flash of light mode.
       Resolution order:
         1. ?theme= URL param (light|dark)
         2. Explicit saved preference (light|dark)
         3. OS system preference (prefers-color-scheme)
         4. Local clock fallback — dark from 7:00pm through 6:59am
       Also keeps the theme in sync if the OS preference changes while open. -->
  <script>
    (function () {
      // One-time reset back to Auto.
      //
      // For a while the toggle had no Auto position: the first click saved
      // 'light' or 'dark' and nothing could ever remove it, so anyone who
      // pressed it once stopped following their device from then on -- with no
      // way back and no sign that a lasting choice had been made. Auto is the
      // toggle's first position again, but a saved value still wins over the
      // system preference (correctly), so those visitors would stay stuck.
      // This clears the key once, and once only: bump the marker to do it again.
      try {
        if (localStorage.getItem('hope_theme_auto_reset') !== '1') {
          localStorage.removeItem('hope_theme');
          localStorage.setItem('hope_theme_auto_reset', '1');
        }
      } catch (e) {}

      function clockTheme() {
        var h = new Date().getHours();
        return (h >= 19 || h < 7) ? 'dark' : 'light';
      }
      function systemTheme() {
        try {
          if (window.matchMedia) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
            if (window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
          }
        } catch (e) {}
        return null;
      }
      function urlTheme() {
        try {
          var p = new URLSearchParams(window.location.search).get('theme');
          if (p === 'light' || p === 'dark') return p;
        } catch (e) {}
        return null;
      }
      function resolveTheme() {
        var u = urlTheme();
        if (u) return u;
        try {
          var saved = localStorage.getItem('hope_theme'); // 'light' | 'dark' (auto removes key)
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (e) {}
        return systemTheme() || clockTheme();
      }
      function applyResolved() {
        document.documentElement.dataset.theme = resolveTheme();
      }
      applyResolved();
      // Live-follow the OS toggle while the tab is open (matters only in Auto
      // mode — a saved value still wins inside resolveTheme).
      try {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.addEventListener) mq.addEventListener('change', applyResolved);
        else if (mq && mq.addListener) mq.addListener(applyResolved);
      } catch (e) {}
    })();
  </script>
